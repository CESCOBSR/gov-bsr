<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계약현황 모니터 | 세스코 부경사업부</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f4f6f9;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e8e8e8;padding:14px 24px;display:flex;align-items:center;gap:12px}
.logo{font-size:16px;font-weight:700}.logo span{color:#2563eb}
.main{padding:20px;max-width:1300px;margin:0 auto}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px}
.section-label{font-size:11px;color:#666;font-weight:600;margin-bottom:6px}
.chip-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.kw-chip{padding:5px 11px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#555;transition:all 0.15s;user-select:none}
.kw-chip.active{background:#2563eb;color:#fff;border-color:#2563eb}
.region-block{margin-bottom:10px}
.region-name{font-size:11px;font-weight:700;color:#888;margin-bottom:5px}
.branch-chips{display:flex;flex-wrap:wrap;gap:4px}
.br-chip{padding:4px 10px;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#555;transition:all 0.15s;user-select:none}
.br-chip.active{background:#ea580c;color:#fff;border-color:#ea580c}
.select-btns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.filter-group label{font-size:11px;color:#666;font-weight:600;display:block;margin-bottom:4px}
.filter-group input,.filter-group select{width:100%;padding:7px 10px;font-size:12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;outline:none;background:#fff}
.btn{padding:7px 14px;font-size:12px;border-radius:8px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;cursor:pointer;font-family:inherit;font-weight:600;transition:all 0.15s}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-green{background:#16a34a;color:#fff;border-color:#16a34a}
.btn-sm{padding:4px 10px;font-size:11px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:12px;text-align:center}
.stat-label{font-size:10px;color:#999;margin-bottom:4px}
.stat-val{font-size:20px;font-weight:700;color:#2563eb}
.view-tabs{display:flex;gap:6px;margin-bottom:12px}
.view-tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#888}
.view-tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
.branch-group{background:#fff;border:1px solid #e8e8e8;border-radius:10px;margin-bottom:10px;overflow:hidden}
.branch-group-header{padding:11px 16px;background:#fafafa;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.branch-group-title{font-size:13px;font-weight:700}
.branch-group-body{display:none}
.branch-group-body.open{display:block}
.table-wrap{background:#fff;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden;margin-bottom:14px}
.table-header{padding:11px 16px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 12px;text-align:left;font-weight:600;font-size:11px;color:#999;border-bottom:1px solid #e8e8e8;background:#fafafa;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f0f0f0;color:#1a1a1a;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafeff}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600}
.badge-ipm{background:#fef2f2;color:#dc2626}
.badge-ihm{background:#fff7ed;color:#ea580c}
.badge-rental{background:#eff6ff;color:#2563eb}
.badge-fs{background:#f0fdf4;color:#16a34a}
.badge-etc{background:#f3f4f6;color:#6b7280}
.cesco-row td{background:#eff6ff!important}
.info-banner{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:12px;color:#1e40af;line-height:1.8}
.loading{text-align:center;padding:40px;color:#999;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .main{padding:12px}
  th,td{padding:6px 8px;font-size:11px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">GOV<span>-BSR</span></div>
  <span style="font-size:12px;color:#999">계약현황 모니터</span>
  <div style="margin-left:auto">
    <a href="https://cescobsr.github.io/gov-bsr/" style="font-size:12px;color:#2563eb;text-decoration:none">← GOV-BSR</a>
  </div>
</div>

<div class="main">

  <div class="info-banner" id="info-banner">
    ⏳ 데이터 불러오는 중...
  </div>

  <div class="card">
    <div class="card-title">🔍 필터</div>

    <div class="section-label">키워드 필터</div>
    <div class="chip-wrap" id="kw-chips">
      <div class="kw-chip active" data-kw="방역">🦟 방역</div>
      <div class="kw-chip active" data-kw="소독">🧴 소독</div>
      <div class="kw-chip active" data-kw="해충">🐛 해충</div>
      <div class="kw-chip active" data-kw="방제">방제</div>
      <div class="kw-chip active" data-kw="살균">살균</div>
      <div class="kw-chip active" data-kw="정수기">💧 정수기</div>
      <div class="kw-chip active" data-kw="공기청정기">🌬️ 공기청정기</div>
      <div class="kw-chip active" data-kw="비데">비데</div>
      <div class="kw-chip active" data-kw="냉온수기">냉온수기</div>
      <div class="kw-chip active" data-kw="청소용역">🧹 청소용역</div>
      <div class="kw-chip active" data-kw="에어컨청소">에어컨청소</div>
      <div class="kw-chip active" data-kw="위생">위생</div>
      <div class="kw-chip active" data-kw="식품위생">식품위생</div>
      <div class="kw-chip active" data-kw="착한가격">착한가격</div>
    </div>

    <div class="section-label">지사 필터</div>
    <div class="select-btns">
      <button class="btn btn-sm" onclick="selectAllBranches()">전체 선택</button>
      <button class="btn btn-sm" onclick="deselectAllBranches()">전체 해제</button>
      <button class="btn btn-sm" onclick="selectRegion('부산')">부산만</button>
      <button class="btn btn-sm" onclick="selectRegion('울산')">울산만</button>
      <button class="btn btn-sm" onclick="selectRegion('경남')">경남만</button>
    </div>
    <div id="branch-selector"></div>

    <div class="filter-grid" style="margin-top:12px">
      <div class="filter-group">
        <label>계약일 시작</label>
        <input type="date" id="date-from">
      </div>
      <div class="filter-group">
        <label>계약일 종료</label>
        <input type="date" id="date-to">
      </div>
      <div class="filter-group">
        <label>계약종류</label>
        <select id="ctrt-kind">
          <option value="">전체</option>
          <option value="용역">용역</option>
          <option value="물품">물품</option>
          <option value="공사">공사</option>
        </select>
      </div>
      <div class="filter-group">
        <label>업체명</label>
        <input type="text" id="company-filter" placeholder="예) 세스코, 시티캅" oninput="applyFilter()">
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="applyFilter()">🔍 필터 적용</button>
      <button class="btn btn-green" onclick="exportExcel()">📥 엑셀</button>
      <button class="btn" onclick="resetFilter()">초기화</button>
    </div>
  </div>

  <div class="stats-row" id="stats-row" style="display:none">
    <div class="stat-card"><div class="stat-label">전체 계약건수</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat-card"><div class="stat-label">총 계약금액</div><div class="stat-val" style="font-size:14px;color:#16a34a" id="s-amount">0</div></div>
    <div class="stat-card"><div class="stat-label">경쟁사 계약</div><div class="stat-val" style="color:#dc2626" id="s-competitor">0</div></div>
    <div class="stat-card"><div class="stat-label">세스코 계약</div><div class="stat-val" style="color:#2563eb" id="s-cesco">0</div></div>
  </div>

  <div class="view-tabs" id="view-tabs" style="display:none">
    <div class="view-tab active" onclick="switchView('branch')" id="tab-branch">📍 지사별 보기</div>
    <div class="view-tab" onclick="switchView('list')" id="tab-list">📋 전체 목록</div>
  </div>

  <div id="branch-view"></div>

  <div id="list-view" style="display:none">
    <div class="table-wrap">
      <div class="table-header">
        <div style="font-size:13px;font-weight:700">전체 목록 <span id="list-count" style="color:#2563eb"></span></div>
        <input type="text" id="table-search" placeholder="검색..." style="padding:6px 10px;font-size:12px;border:1px solid #e0e0e0;border-radius:8px;outline:none;width:160px" oninput="renderListView(currentFiltered)">
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>지사</th><th>시도</th><th>자치단체</th><th>계약명</th>
            <th>종류</th><th>금액</th><th>업체명</th><th>계약일</th><th>서비스</th>
          </tr></thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const REGIONS=[
  {name:'부산동부권역',branches:['부산동래','부산수영','부산진구','부산기장','해운대']},
  {name:'부산서부권역',branches:['부산서부','부산남부','부산북부','부산사하','김해남부','김해북부']},
  {name:'울산양산권역',branches:['울산북부','울산남부','울산서부','울산중부','양산']},
  {name:'경남동부권역',branches:['창원동부','창원서부','창원남부','창원북부']},
  {name:'경남서부권역',branches:['진주동부','진주서부','거제통영','사천남해']}
];

let rawData=[];
let currentFiltered=[];
let currentView='branch';

// 지사 선택기
function buildBranchSelector(){
  const el=document.getElementById('branch-selector');
  el.innerHTML=REGIONS.map(r=>`
    <div class="region-block">
      <div class="region-name">${r.name}</div>
      <div class="branch-chips">${r.branches.map(b=>`<div class="br-chip active" data-branch="${b}" onclick="this.classList.toggle('active');applyFilter()">${b}</div>`).join('')}</div>
    </div>`).join('');
}
function selectAllBranches(){document.querySelectorAll('.br-chip').forEach(c=>c.classList.add('active'));applyFilter();}
function deselectAllBranches(){document.querySelectorAll('.br-chip').forEach(c=>c.classList.remove('active'));applyFilter();}
function selectRegion(kw){
  deselectAllBranches();
  document.querySelectorAll('.br-chip').forEach(c=>{
    const b=c.dataset.branch;
    const r=REGIONS.find(r=>r.branches.includes(b));
    if(r&&r.name.includes(kw==='부산'?'부산':kw==='울산'?'울산':'경남'))c.classList.add('active');
  });
  applyFilter();
}
function getActiveBranches(){return[...document.querySelectorAll('.br-chip.active')].map(c=>c.dataset.branch);}
function getActiveKeywords(){return[...document.querySelectorAll('.kw-chip.active')].map(c=>c.dataset.kw);}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function formatAmt(v){
  const n=parseInt(v||0);if(isNaN(n))return'—';
  if(n>=100000000)return(n/100000000).toFixed(1)+'억';
  if(n>=10000)return Math.round(n/10000)+'만원';
  return n.toLocaleString()+'원';
}
function formatDate(d){
  if(!d||d.length!==8)return d||'—';
  return`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`;
}
function isCesco(name){return/세스코|cesco/i.test(name||'');}
function classifyService(name){
  if(!name)return'기타';
  if(/방역|소독|해충|방제|살균|구서|구충|방충/.test(name))return'IPM';
  if(/청소|에어컨|후드|그리스|미화|환경청소/.test(name))return'IHM';
  if(/정수기|공기청정기|비데|냉온수기|음수대/.test(name))return'렌탈';
  if(/위생|식품|HACCP|급식/.test(name))return'FS';
  return'기타';
}
function serviceBadge(svc){
  const map={IPM:'badge-ipm',IHM:'badge-ihm','렌탈':'badge-rental',FS:'badge-fs','기타':'badge-etc'};
  return`<span class="badge ${map[svc]||'badge-etc'}">${svc}</span>`;
}

// 데이터 로드
async function loadData(){
  try{
    const resp=await fetch('contract-data/data.json?t='+Date.now());
    if(!resp.ok)throw new Error('파일 없음');
    const json=await resp.json();
    rawData=json.data||[];
    const updatedAt=json.updated_at||'';
    document.getElementById('info-banner').innerHTML=
      `✅ 데이터 로드 완료 — <b>${rawData.length}건</b> | 마지막 업데이트: <b>${updatedAt}</b><br>
      <span style="font-size:11px;color:#3b82f6">매일 오전 10시 자동 업데이트 | 키워드/지사 필터로 원하는 데이터를 찾아보세요</span>`;
    document.getElementById('stats-row').style.display='grid';
    document.getElementById('view-tabs').style.display='flex';
    applyFilter();
  }catch(e){
    document.getElementById('info-banner').innerHTML=
      `⚠️ 데이터 파일이 아직 없습니다.<br>
      <b>GitHub Actions를 수동으로 한 번 실행</b>하면 데이터가 생성돼요.<br>
      <span style="font-size:11px">레포 → Actions → 계약현황 자동 수집 → Run workflow</span>`;
  }
}

function applyFilter(){
  const activeKws=getActiveKeywords();
  const activeBranches=getActiveBranches();
  const dateFrom=document.getElementById('date-from').value?.replace(/-/g,'')||'';
  const dateTo=document.getElementById('date-to').value?.replace(/-/g,'')||'';
  const ctrtKind=document.getElementById('ctrt-kind').value;
  const company=document.getElementById('company-filter').value.toLowerCase();

  currentFiltered=rawData.filter(r=>{
    if(activeKws.length>0&&!activeKws.includes(r._keyword))return false;
    if(activeBranches.length>0&&!activeBranches.includes(r._branch))return false;
    const d=r.smz_ctrt_ymd||'';
    if(dateFrom&&d<dateFrom)return false;
    if(dateTo&&d>dateTo)return false;
    if(ctrtKind&&!(r.ctrt_knd_nm||'').includes(ctrtKind))return false;
    if(company&&!(r.clt_nm||'').toLowerCase().includes(company))return false;
    return true;
  });

  // 통계
  const totalAmt=currentFiltered.reduce((s,r)=>s+parseInt(r.ctrt_tot_tott_amt||0),0);
  document.getElementById('s-total').textContent=currentFiltered.length.toLocaleString();
  document.getElementById('s-amount').textContent=formatAmt(totalAmt);
  document.getElementById('s-cesco').textContent=currentFiltered.filter(r=>isCesco(r.clt_nm)).length;
  document.getElementById('s-competitor').textContent=currentFiltered.filter(r=>!isCesco(r.clt_nm)).length;

  renderBranchView(currentFiltered);
  renderListView(currentFiltered);
}

function renderBranchView(data){
  const activeBranches=getActiveBranches();
  const grouped={};
  activeBranches.forEach(b=>grouped[b]=[]);
  data.forEach(r=>{if(r._branch&&grouped[r._branch])grouped[r._branch].push(r);});

  document.getElementById('branch-view').innerHTML=REGIONS.map(region=>{
    const rBranches=region.branches.filter(b=>activeBranches.includes(b));
    if(!rBranches.length)return'';
    return`<div style="font-size:11px;font-weight:700;color:#888;padding:4px 0;margin-bottom:4px">${region.name}</div>`+
    rBranches.map(branch=>{
      const items=(grouped[branch]||[]).sort((a,b)=>(b.smz_ctrt_ymd||'').localeCompare(a.smz_ctrt_ymd||''));
      const amt=items.reduce((s,r)=>s+parseInt(r.ctrt_tot_tott_amt||0),0);
      const cescoC=items.filter(r=>isCesco(r.clt_nm)).length;
      return`<div class="branch-group">
        <div class="branch-group-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <div class="branch-group-title">📍 ${branch} <span style="font-size:11px;color:#2563eb;font-weight:400">${items.length}건</span></div>
          <div style="font-size:11px;color:#999">${formatAmt(amt)} | 세스코 ${cescoC}건 ▼</div>
        </div>
        <div class="branch-group-body ${items.length>0?'open':''}">
          ${items.length===0
            ?'<div style="padding:20px;text-align:center;color:#bbb;font-size:12px">해당 지사 계약 없음</div>'
            :`<div style="overflow-x:auto"><table>
              <thead><tr><th>자치단체</th><th>계약명</th><th>종류</th><th>금액</th><th>업체명</th><th>계약일</th><th>서비스</th></tr></thead>
              <tbody>${items.map(r=>`<tr class="${isCesco(r.clt_nm)?'cesco-row':''}">
                <td style="font-size:11px">${r.laf_hg_nm||'—'}</td>
                <td style="font-weight:500;max-width:260px">${r.ctrt_trgt_nm||'—'}</td>
                <td>${r.ctrt_knd_nm||'—'}</td>
                <td style="font-weight:600;color:#16a34a">${formatAmt(r.ctrt_tot_tott_amt)}</td>
                <td style="font-weight:${isCesco(r.clt_nm)?'700':'400'};color:${isCesco(r.clt_nm)?'#2563eb':'#1a1a1a'}">${r.clt_nm||'—'}</td>
                <td style="font-size:11px">${formatDate(r.smz_ctrt_ymd)}</td>
                <td>${serviceBadge(classifyService(r.ctrt_trgt_nm))}</td>
              </tr>`).join('')}</tbody>
            </table></div>`}
        </div>
      </div>`;
    }).join('');
  }).join('');
}

function renderListView(data){
  const q=document.getElementById('table-search')?.value?.toLowerCase()||'';
  const filtered=q?data.filter(r=>
    (r.ctrt_trgt_nm||'').toLowerCase().includes(q)||
    (r.laf_hg_nm||'').toLowerCase().includes(q)||
    (r.clt_nm||'').toLowerCase().includes(q)||
    (r._branch||'').toLowerCase().includes(q)
  ):data;
  const sorted=[...filtered].sort((a,b)=>(b.smz_ctrt_ymd||'').localeCompare(a.smz_ctrt_ymd||''));
  document.getElementById('list-count').textContent=`${sorted.length}건`;
  document.getElementById('list-body').innerHTML=sorted.map(r=>`<tr class="${isCesco(r.clt_nm)?'cesco-row':''}">
    <td style="font-size:11px">${r._branch||'—'}</td>
    <td>${r.wa_laf_hg_nm||'—'}</td>
    <td style="font-size:11px">${r.laf_hg_nm||'—'}</td>
    <td style="font-weight:500;max-width:240px">${r.ctrt_trgt_nm||'—'}</td>
    <td>${r.ctrt_knd_nm||'—'}</td>
    <td style="font-weight:600;color:#16a34a">${formatAmt(r.ctrt_tot_tott_amt)}</td>
    <td style="font-weight:${isCesco(r.clt_nm)?'700':'400'};color:${isCesco(r.clt_nm)?'#2563eb':'#1a1a1a'}">${r.clt_nm||'—'}</td>
    <td style="font-size:11px">${formatDate(r.smz_ctrt_ymd)}</td>
    <td>${serviceBadge(classifyService(r.ctrt_trgt_nm))}</td>
  </tr>`).join('');
}

function switchView(v){
  currentView=v;
  document.getElementById('branch-view').style.display=v==='branch'?'block':'none';
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  document.getElementById('tab-branch').className='view-tab'+(v==='branch'?' active':'');
  document.getElementById('tab-list').className='view-tab'+(v==='list'?' active':'');
}

function exportExcel(){
  if(!currentFiltered.length){showToast('데이터가 없습니다');return;}
  const rows=[['지사','시도','자치단체','계약명','계약종류','계약방법','계약금액(원)','업체명','계약일','서비스']];
  [...currentFiltered].sort((a,b)=>(a._branch||'').localeCompare(b._branch||'')).forEach(r=>{
    rows.push([r._branch||'',r.wa_laf_hg_nm||'',r.laf_hg_nm||'',r.ctrt_trgt_nm||'',
      r.ctrt_knd_nm||'',r.ctrt_mth_nm||'',parseInt(r.ctrt_tot_tott_amt||0),
      r.clt_nm||'',formatDate(r.smz_ctrt_ymd),classifyService(r.ctrt_trgt_nm||'')]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:10},{wch:8},{wch:14},{wch:30},{wch:8},{wch:12},{wch:14},{wch:16},{wch:12},{wch:8}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'계약현황');
  const d=new Date().toISOString().split('T')[0].replace(/-/g,'');
  XLSX.writeFile(wb,`세스코_계약현황_${d}.xlsx`);
  showToast('엑셀 다운로드 완료!');
}

function resetFilter(){
  document.querySelectorAll('.kw-chip').forEach(c=>c.classList.add('active'));
  selectAllBranches();
  document.getElementById('ctrt-kind').value='';
  document.getElementById('company-filter').value='';
  document.getElementById('date-from').value='';
  document.getElementById('date-to').value='';
  applyFilter();
}

document.getElementById('kw-chips').addEventListener('click',e=>{
  if(e.target.classList.contains('kw-chip')){e.target.classList.toggle('active');applyFilter();}
});

buildBranchSelector();
loadData();
</script>
</body>
</html>
