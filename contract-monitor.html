<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계약현황 모니터 | 세스코 부경사업부</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f4f6f9;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e8e8e8;padding:14px 24px;display:flex;align-items:center;gap:12px}
.logo{font-size:16px;font-weight:700}.logo span{color:#2563eb}
.main{padding:20px;max-width:1300px;margin:0 auto}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px}
.section-label{font-size:11px;color:#666;font-weight:600;margin-bottom:6px}
.chip-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.kw-chip{padding:5px 11px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#555;transition:all 0.15s;user-select:none}
.kw-chip.active{background:#2563eb;color:#fff;border-color:#2563eb}
.region-block{margin-bottom:10px}
.region-name{font-size:11px;font-weight:700;color:#888;margin-bottom:5px}
.branch-chips{display:flex;flex-wrap:wrap;gap:4px}
.br-chip{padding:4px 10px;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#555;transition:all 0.15s;user-select:none}
.br-chip.active{background:#ea580c;color:#fff;border-color:#ea580c}
.select-btns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.filter-group label{font-size:11px;color:#666;font-weight:600;display:block;margin-bottom:4px}
.filter-group input,.filter-group select{width:100%;padding:7px 10px;font-size:12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;outline:none;background:#fff}
.btn{padding:7px 14px;font-size:12px;border-radius:8px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;cursor:pointer;font-family:inherit;font-weight:600;transition:all 0.15s}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-green{background:#16a34a;color:#fff;border-color:#16a34a}
.btn-sm{padding:4px 10px;font-size:11px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:12px;text-align:center}
.stat-label{font-size:10px;color:#999;margin-bottom:4px}
.stat-val{font-size:20px;font-weight:700;color:#2563eb}
.view-tabs{display:flex;gap:6px;margin-bottom:12px}
.view-tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#888}
.view-tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
.branch-group{background:#fff;border:1px solid #e8e8e8;border-radius:10px;margin-bottom:10px;overflow:hidden}
.branch-group-header{padding:11px 16px;background:#fafafa;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.branch-group-title{font-size:13px;font-weight:700}
.src-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;vertical-align:middle;margin-left:4px}
.src-own{background:#f0fdf4;color:#16a34a}
.src-lofin{background:#eff6ff;color:#2563eb}
.src-mixed{background:#fef3c7;color:#b45309}
.branch-group-body{display:none}
.branch-group-body.open{display:block}
.table-wrap{background:#fff;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden;margin-bottom:14px}
.table-header{padding:11px 16px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 12px;text-align:left;font-weight:600;font-size:11px;color:#999;border-bottom:1px solid #e8e8e8;background:#fafafa;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f0f0f0;color:#1a1a1a;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafeff}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600}
.badge-ipm{background:#fef2f2;color:#dc2626}
.badge-ihm{background:#fff7ed;color:#ea580c}
.badge-rental{background:#eff6ff;color:#2563eb}
.badge-fs{background:#f0fdf4;color:#16a34a}
.badge-etc{background:#f3f4f6;color:#6b7280}
.cesco-row td{background:#eff6ff!important}
.info-banner{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:12px;color:#1e40af;line-height:1.8}
.loading{text-align:center;padding:40px;color:#999;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:#999;pointer-events:none}
.search-wrap input{width:100%;padding:10px 12px 10px 34px;font-size:13px;border:1px solid #e0e0e0;border-radius:10px;font-family:inherit;outline:none;background:#fff}
.search-wrap input:focus{border-color:#2563eb}
.stat-card.clickable{cursor:pointer;transition:all 0.15s}
.stat-card.clickable:hover{border-color:#2563eb;background:#f8fafd}
.stat-card.mode-active{border-color:#2563eb;background:#eff6ff}
.mode-banner{display:none;align-items:center;justify-content:space-between;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:12px;color:#1e40af}
.mode-banner.show{display:flex}
.mode-banner button{background:none;border:none;color:#2563eb;font-size:12px;font-weight:700;cursor:pointer}
tr.clickable-row{cursor:pointer}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:400;opacity:0;pointer-events:none;transition:opacity 0.2s}
.sheet-overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:401;padding:20px;max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform 0.25s ease;max-height:85vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,0.15)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:15px;font-weight:700;margin-bottom:14px}
.sheet-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f4f4f4;font-size:12px}
.sheet-row .k{color:#999}
.sheet-row .v{font-weight:600;text-align:right;max-width:65%}
.sheet-field{margin-top:14px}
.sheet-field label{font-size:11px;color:#666;font-weight:600;display:block;margin-bottom:5px}
.sheet-field select{width:100%;padding:9px 10px;font-size:13px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;outline:none;background:#fff}
.sheet-actions{display:flex;gap:8px;margin-top:18px}
.sheet-actions .btn{flex:1;padding:11px;font-size:13px}
.btn-danger{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.edited-badge{display:inline-block;padding:1px 6px;border-radius:5px;font-size:9px;font-weight:600;background:#fef3c7;color:#b45309;margin-left:4px;vertical-align:middle}
@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .main{padding:12px}
  th,td{padding:6px 8px;font-size:11px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">GOV<span>-BSR</span></div>
  <span style="font-size:12px;color:#999">계약현황 모니터</span>
  <div style="margin-left:auto">
    <a href="https://cescobsr.github.io/gov-bsr/" style="font-size:12px;color:#2563eb;text-decoration:none">← GOV-BSR</a>
  </div>
</div>

<div class="main">

  <div class="info-banner" id="info-banner">
    ⏳ 데이터 불러오는 중...
  </div>

  <div class="card">
    <div class="card-title">🔍 필터</div>

    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="global-search" placeholder="계약명, 지자체, 동/읍/면, 업체명으로 검색..." oninput="onSearchInput()">
    </div>

    <div class="section-label">키워드 필터</div>
    <div class="chip-wrap" id="kw-chips">
      <div class="kw-chip active" data-kw="방역">🦟 방역</div>
      <div class="kw-chip active" data-kw="소독">🧴 소독</div>
      <div class="kw-chip active" data-kw="해충">🐛 해충</div>
      <div class="kw-chip active" data-kw="방제">방제</div>
      <div class="kw-chip active" data-kw="살균">살균</div>
      <div class="kw-chip active" data-kw="정수기">💧 정수기</div>
      <div class="kw-chip active" data-kw="공기청정기">🌬️ 공기청정기</div>
      <div class="kw-chip active" data-kw="비데">비데</div>
      <div class="kw-chip active" data-kw="냉온수기">냉온수기</div>
      <div class="kw-chip active" data-kw="청소용역">🧹 청소용역</div>
      <div class="kw-chip active" data-kw="에어컨청소">에어컨청소</div>
      <div class="kw-chip active" data-kw="위생">위생</div>
      <div class="kw-chip active" data-kw="식품위생">식품위생</div>
      <div class="kw-chip active" data-kw="착한가격">착한가격</div>
      <div class="kw-chip active" data-kw="전통시장">전통시장</div>
      <div class="kw-chip active" data-kw="냉난방기">냉난방기</div>
      <div class="kw-chip active" data-kw="자가품질">자가품질</div>
      <div class="kw-chip active" data-kw="HACCP">HACCP</div>
      <div class="kw-chip active" data-kw="영양성분">영양성분</div>
      <div class="kw-chip active" data-kw="유효성평가">유효성평가</div>
      <div class="kw-chip active" data-kw="CCP">CCP</div>
    </div>

    <div class="section-label">지자체 필터</div>
    <div class="select-btns">
      <button class="btn btn-sm" onclick="selectAllJurisdictions()">전체 선택</button>
      <button class="btn btn-sm" onclick="deselectAllJurisdictions()">전체 해제</button>
      <button class="btn btn-sm" onclick="selectSido('부산')">부산만</button>
      <button class="btn btn-sm" onclick="selectSido('울산')">울산만</button>
      <button class="btn btn-sm" onclick="selectSido('경남')">경남만</button>
    </div>
    <div id="jurisdiction-selector"><div style="font-size:11px;color:#bbb;padding:8px 0">데이터 로드 후 표시됩니다</div></div>

    <div class="filter-grid" style="margin-top:12px">
      <div class="filter-group">
        <label>계약일 시작</label>
        <input type="date" id="date-from">
      </div>
      <div class="filter-group">
        <label>계약일 종료</label>
        <input type="date" id="date-to">
      </div>
      <div class="filter-group">
        <label>계약종류</label>
        <select id="ctrt-kind">
          <option value="">전체</option>
          <option value="용역">용역</option>
          <option value="물품">물품</option>
          <option value="공사">공사</option>
        </select>
      </div>
      <div class="filter-group">
        <label>업체명</label>
        <input type="text" id="company-filter" placeholder="예) 세스코, 시티캅" oninput="applyFilter()">
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="applyFilter()">🔍 필터 적용</button>
      <button class="btn btn-green" onclick="exportExcel()">📥 엑셀</button>
      <button class="btn" onclick="resetFilter()">초기화</button>
    </div>
  </div>

  <div class="stats-row" id="stats-row" style="display:none">
    <div class="stat-card clickable" id="card-total" onclick="setCescoMode('all')"><div class="stat-label">전체 계약건수</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat-card clickable" id="card-amount" onclick="setCescoMode('all')"><div class="stat-label">총 계약금액</div><div class="stat-val" style="font-size:14px;color:#16a34a" id="s-amount">0</div></div>
    <div class="stat-card clickable" id="card-competitor" onclick="setCescoMode('competitor')"><div class="stat-label">경쟁사 계약</div><div class="stat-val" style="color:#dc2626" id="s-competitor">0</div></div>
    <div class="stat-card clickable" id="card-cesco" onclick="setCescoMode('cesco')"><div class="stat-label">세스코 계약</div><div class="stat-val" style="color:#2563eb" id="s-cesco">0</div></div>
  </div>

  <div class="mode-banner" id="mode-banner">
    <span id="mode-banner-text"></span>
    <button onclick="setCescoMode('all')">✕ 필터 해제</button>
  </div>

  <div class="view-tabs" id="view-tabs" style="display:none">
    <div class="view-tab active" onclick="switchView('juris')" id="tab-juris">📍 지자체별 보기</div>
    <div class="view-tab" onclick="switchView('list')" id="tab-list">📋 전체 목록</div>
  </div>

  <div id="juris-view"></div>

  <div id="list-view" style="display:none">
    <div class="table-wrap">
      <div class="table-header">
        <div style="font-size:13px;font-weight:700">전체 목록 <span id="list-count" style="color:#2563eb"></span></div>
        <span style="font-size:11px;color:#bbb">행을 클릭하면 수정/삭제할 수 있어요</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>시도</th><th>자치단체</th><th>계약명</th>
            <th>종류</th><th>금액</th><th>업체명</th><th>계약일</th><th>서비스</th>
          </tr></thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<div class="sheet-overlay" id="sheet-overlay" onclick="closeEditModal()"></div>
<div class="sheet" id="edit-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">계약 정보 수정</div>
  <div id="sheet-body"></div>
  <div class="sheet-field">
    <label>서비스 분류</label>
    <select id="sheet-service-select">
      <option value="IPM">IPM (방역/소독/해충)</option>
      <option value="IHM">IHM (청소용역)</option>
      <option value="렌탈">렌탈 (정수기/공기청정기 등)</option>
      <option value="FS">FS (위생/식품)</option>
      <option value="기타">기타</option>
    </select>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-danger" onclick="deleteRecordFromSheet()">🗑 목록에서 삭제</button>
    <button class="btn btn-primary" onclick="saveEditFromSheet()">저장</button>
  </div>
  <div style="margin-top:8px">
    <button class="btn" style="width:100%" onclick="closeEditModal()">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let rawData=[];
let currentFiltered=[];
let currentView='juris';
let jurisdictionMap={}; // { sido: Set(자치단체) } — 데이터 로드 후 채워짐
let sidoOrder=[];
let cescoMode='all'; // 'all' | 'cesco' | 'competitor'
let searchDebounceTimer=null;
let currentEditId=null;

// ── 로컬 수정/삭제 오버레이 (이 브라우저에만 저장됨. 원본 data.json은 바뀌지 않음) ──
let overrides={};
let deletedIds=new Set();
try{overrides=JSON.parse(localStorage.getItem('govbsr_overrides')||'{}');}catch(e){overrides={};}
try{deletedIds=new Set(JSON.parse(localStorage.getItem('govbsr_deleted')||'[]'));}catch(e){deletedIds=new Set();}
function saveOverrides(){localStorage.setItem('govbsr_overrides',JSON.stringify(overrides));}
function saveDeleted(){localStorage.setItem('govbsr_deleted',JSON.stringify([...deletedIds]));}

// 레코드 고유 id 생성 (원본 데이터에 고유키가 없어서 주요 필드 조합으로 생성)
function recordId(r){
  const raw=`${r.laf_hg_nm||''}|${r.ctrt_trgt_nm||''}|${r.clt_nm||''}|${r.smz_ctrt_ymd||''}|${r.ctrt_tot_tott_amt||''}`;
  let h=0;
  for(let i=0;i<raw.length;i++){h=(h*31+raw.charCodeAt(i))|0;}
  return'r'+(h>>>0).toString(36);
}
function getService(r){
  const ov=overrides[r._id];
  return ov&&ov.service?ov.service:classifyService(r.ctrt_trgt_nm);
}
function isOverridden(r){return!!(overrides[r._id]&&overrides[r._id].service);}

function sidoOf(waLafHgNm){
  const s=waLafHgNm||'';
  if(s.includes('부산'))return'부산';
  if(s.includes('울산'))return'울산';
  if(s.includes('경남')||s.includes('경상남'))return'경남';
  return'기타';
}

// 지자체 선택기 — 실제 수집된 데이터 기준으로 동적 생성
function buildJurisdictionSelector(){
  jurisdictionMap={};
  rawData.forEach(r=>{
    const sido=sidoOf(r.wa_laf_hg_nm);
    const gu=r.laf_hg_nm||'미상';
    if(!jurisdictionMap[sido])jurisdictionMap[sido]=new Set();
    jurisdictionMap[sido].add(gu);
  });
  sidoOrder=['부산','울산','경남'].filter(s=>jurisdictionMap[s]);
  Object.keys(jurisdictionMap).forEach(s=>{if(!sidoOrder.includes(s))sidoOrder.push(s);});

  const el=document.getElementById('jurisdiction-selector');
  el.innerHTML=sidoOrder.map(sido=>{
    const gus=[...jurisdictionMap[sido]].sort((a,b)=>a.localeCompare(b,'ko'));
    return`<div class="region-block">
      <div class="region-name">${sido}</div>
      <div class="branch-chips">${gus.map(g=>`<div class="br-chip active" data-sido="${sido}" data-gu="${g}" onclick="this.classList.toggle('active');applyFilter()">${g}</div>`).join('')}</div>
    </div>`;
  }).join('');
}
function selectAllJurisdictions(){document.querySelectorAll('.br-chip').forEach(c=>c.classList.add('active'));applyFilter();}
function deselectAllJurisdictions(){document.querySelectorAll('.br-chip').forEach(c=>c.classList.remove('active'));applyFilter();}
function selectSido(sido){
  deselectAllJurisdictions();
  document.querySelectorAll('.br-chip').forEach(c=>{
    if(c.dataset.sido===sido)c.classList.add('active');
  });
  applyFilter();
}
function getActiveJurisdictions(){
  return[...document.querySelectorAll('.br-chip.active')].map(c=>`${c.dataset.sido}||${c.dataset.gu}`);
}
function jurisKey(r){return`${sidoOf(r.wa_laf_hg_nm)}||${r.laf_hg_nm||'미상'}`;}
function getActiveKeywords(){return[...document.querySelectorAll('.kw-chip.active')].map(c=>c.dataset.kw);}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function formatAmt(v){
  const n=parseInt(v||0);if(isNaN(n))return'—';
  if(n>=100000000)return(n/100000000).toFixed(1)+'억';
  if(n>=10000)return Math.round(n/10000)+'만원';
  return n.toLocaleString()+'원';
}
function formatDate(d){
  if(!d||d.length!==8)return d||'—';
  return`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`;
}
function isCesco(name){return/세스코|cesco/i.test(name||'');}
function classifyService(name){
  if(!name)return'기타';
  if(/방역|소독|해충|방제|살균|구서|구충|방충/.test(name))return'IPM';
  if(/청소|에어컨|후드|그리스|미화|환경청소/.test(name))return'IHM';
  if(/정수기|공기청정기|비데|냉온수기|음수대/.test(name))return'렌탈';
  if(/위생|식품|HACCP|급식/.test(name))return'FS';
  return'기타';
}
function serviceBadge(svc){
  const map={IPM:'badge-ipm',IHM:'badge-ihm','렌탈':'badge-rental',FS:'badge-fs','기타':'badge-etc'};
  return`<span class="badge ${map[svc]||'badge-etc'}">${svc}</span>`;
}

// 데이터 로드
async function loadData(){
  try{
    const resp=await fetch('contract-data/data.json?t='+Date.now());
    if(!resp.ok)throw new Error('파일 없음');
    const json=await resp.json();
    rawData=json.data||[];
    rawData.forEach(r=>{r._id=recordId(r);});
    const updatedAt=json.updated_at||'';
    const collectionStart=json.collection_start||'';
    document.getElementById('info-banner').innerHTML=
      `✅ 데이터 로드 완료 — <b>${rawData.length}건</b> | 수집기간: <b>${collectionStart||'—'} ~ 현재</b> | 마지막 업데이트: <b>${updatedAt}</b><br>
      <span style="font-size:11px;color:#3b82f6">매일 오전 10시 자동 업데이트 | 키워드/지자체 필터로 원하는 데이터를 찾아보세요</span><br>
      <span style="font-size:11px;color:#888">데이터 소스: <span class="src-badge src-lofin">lofin365</span> 행안부 통합시스템 | <span class="src-badge src-own">지자체 자체</span> 개별 사이트 직접 수집(더 정확)</span>`;
    document.getElementById('stats-row').style.display='grid';
    document.getElementById('view-tabs').style.display='flex';
    buildJurisdictionSelector();
    applyFilter();
  }catch(e){
    document.getElementById('info-banner').innerHTML=
      `⚠️ 데이터 파일이 아직 없습니다.<br>
      <b>GitHub Actions를 수동으로 한 번 실행</b>하면 데이터가 생성돼요.<br>
      <span style="font-size:11px">레포 → Actions → 계약현황 자동 수집 → Run workflow</span>`;
  }
}

function onSearchInput(){
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer=setTimeout(applyFilter,150);
}

function applyFilter(){
  const activeKws=getActiveKeywords();
  const activeJuris=getActiveJurisdictions();
  const dateFrom=document.getElementById('date-from').value?.replace(/-/g,'')||'';
  const dateTo=document.getElementById('date-to').value?.replace(/-/g,'')||'';
  const ctrtKind=document.getElementById('ctrt-kind').value;
  const company=document.getElementById('company-filter').value.toLowerCase();
  const searchQ=(document.getElementById('global-search')?.value||'').trim().toLowerCase();

  // 삭제된 항목 제외 + 기본 필터 (검색 포함) → 통계는 항상 이 기준
  const baseFiltered=rawData.filter(r=>{
    if(deletedIds.has(r._id))return false;
    if(activeKws.length>0&&!activeKws.includes(r._keyword))return false;
    if(activeJuris.length>0&&!activeJuris.includes(jurisKey(r)))return false;
    const d=r.smz_ctrt_ymd||'';
    if(dateFrom&&d<dateFrom)return false;
    if(dateTo&&d>dateTo)return false;
    if(ctrtKind&&!(r.ctrt_knd_nm||'').includes(ctrtKind))return false;
    if(company&&!(r.clt_nm||'').toLowerCase().includes(company))return false;
    if(searchQ){
      const hay=`${r.ctrt_trgt_nm||''} ${r.laf_hg_nm||''} ${r.wa_laf_hg_nm||''} ${r.clt_nm||''}`.toLowerCase();
      if(!hay.includes(searchQ))return false;
    }
    return true;
  });

  // 통계 (전체계약건수/총계약금액/경쟁사/세스코 — 세스코 모드와 무관하게 항상 baseFiltered 기준)
  const totalAmt=baseFiltered.reduce((s,r)=>s+parseInt(r.ctrt_tot_tott_amt||0),0);
  document.getElementById('s-total').textContent=baseFiltered.length.toLocaleString();
  document.getElementById('s-amount').textContent=formatAmt(totalAmt);
  document.getElementById('s-cesco').textContent=baseFiltered.filter(r=>isCesco(r.clt_nm)).length;
  document.getElementById('s-competitor').textContent=baseFiltered.filter(r=>!isCesco(r.clt_nm)).length;

  // 세스코 모드에 따라 실제 표시되는 목록만 좁힘
  currentFiltered=cescoMode==='cesco'?baseFiltered.filter(r=>isCesco(r.clt_nm))
    :cescoMode==='competitor'?baseFiltered.filter(r=>!isCesco(r.clt_nm))
    :baseFiltered;

  updateModeBanner();
  updateStatCardHighlight();
  renderJurisdictionView(currentFiltered);
  renderListView(currentFiltered);
}

function setCescoMode(mode){
  cescoMode=mode;
  applyFilter();
  if(mode!=='all'){switchView('list');}
}
function updateModeBanner(){
  const banner=document.getElementById('mode-banner');
  const text=document.getElementById('mode-banner-text');
  if(cescoMode==='cesco'){text.textContent=`🔵 세스코 계약 ${currentFiltered.length}건만 보는 중`;banner.classList.add('show');}
  else if(cescoMode==='competitor'){text.textContent=`🔴 경쟁사 계약 ${currentFiltered.length}건만 보는 중`;banner.classList.add('show');}
  else{banner.classList.remove('show');}
}
function updateStatCardHighlight(){
  document.getElementById('card-cesco').classList.toggle('mode-active',cescoMode==='cesco');
  document.getElementById('card-competitor').classList.toggle('mode-active',cescoMode==='competitor');
}

function renderJurisdictionView(data){
  const activeJuris=getActiveJurisdictions();
  const grouped={};
  activeJuris.forEach(k=>grouped[k]=[]);
  data.forEach(r=>{const k=jurisKey(r);if(grouped[k])grouped[k].push(r);});

  document.getElementById('juris-view').innerHTML=sidoOrder.map(sido=>{
    const gus=[...(jurisdictionMap[sido]||[])].sort((a,b)=>a.localeCompare(b,'ko'));
    const activeGus=gus.filter(g=>activeJuris.includes(`${sido}||${g}`));
    if(!activeGus.length)return'';
    return`<div style="font-size:11px;font-weight:700;color:#888;padding:4px 0;margin-bottom:4px">${sido}</div>`+
    activeGus.map(gu=>{
      const key=`${sido}||${gu}`;
      const items=(grouped[key]||[]).sort((a,b)=>(b.smz_ctrt_ymd||'').localeCompare(a.smz_ctrt_ymd||''));
      const amt=items.reduce((s,r)=>s+parseInt(r.ctrt_tot_tott_amt||0),0);
      const cescoC=items.filter(r=>isCesco(r.clt_nm)).length;
      const sources=new Set(items.map(r=>r._source||'lofin365'));
      let srcBadge='';
      if(sources.size===1){
        const s=[...sources][0];
        srcBadge=s==='지자체자체'?'<span class="src-badge src-own">지자체 자체</span>':'<span class="src-badge src-lofin">lofin365</span>';
      }else if(sources.size>1){
        srcBadge='<span class="src-badge src-mixed">지자체자체+lofin365</span>';
      }
      return`<div class="branch-group">
        <div class="branch-group-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <div class="branch-group-title">📍 ${gu} <span style="font-size:11px;color:#2563eb;font-weight:400">${items.length}건</span> ${srcBadge}</div>
          <div style="font-size:11px;color:#999">${formatAmt(amt)} | 세스코 ${cescoC}건 ▼</div>
        </div>
        <div class="branch-group-body ${items.length>0?'open':''}">
          ${items.length===0
            ?'<div style="padding:20px;text-align:center;color:#bbb;font-size:12px">해당 지자체 계약 없음</div>'
            :`<div style="overflow-x:auto"><table>
              <thead><tr><th>계약명</th><th>종류</th><th>금액</th><th>업체명</th><th>계약일</th><th>서비스</th></tr></thead>
              <tbody>${items.map(r=>`<tr class="clickable-row ${isCesco(r.clt_nm)?'cesco-row':''}" onclick="openEditModal('${r._id}')">
                <td style="font-weight:500;max-width:280px">${r.ctrt_trgt_nm||'—'}</td>
                <td>${r.ctrt_knd_nm||'—'}</td>
                <td style="font-weight:600;color:#16a34a">${formatAmt(r.ctrt_tot_tott_amt)}</td>
                <td style="font-weight:${isCesco(r.clt_nm)?'700':'400'};color:${isCesco(r.clt_nm)?'#2563eb':'#1a1a1a'}">${r.clt_nm||'—'}</td>
                <td style="font-size:11px">${formatDate(r.smz_ctrt_ymd)}</td>
                <td>${serviceBadge(getService(r))}${isOverridden(r)?'<span class="edited-badge">수정됨</span>':''}</td>
              </tr>`).join('')}</tbody>
            </table></div>`}
        </div>
      </div>`;
    }).join('');
  }).join('');
}

function renderListView(data){
  const sorted=[...data].sort((a,b)=>(b.smz_ctrt_ymd||'').localeCompare(a.smz_ctrt_ymd||''));
  document.getElementById('list-count').textContent=`${sorted.length}건`;
  document.getElementById('list-body').innerHTML=sorted.map(r=>`<tr class="clickable-row ${isCesco(r.clt_nm)?'cesco-row':''}" onclick="openEditModal('${r._id}')">
    <td>${r.wa_laf_hg_nm||'—'}</td>
    <td style="font-size:11px">${r.laf_hg_nm||'—'}</td>
    <td style="font-weight:500;max-width:240px">${r.ctrt_trgt_nm||'—'}</td>
    <td>${r.ctrt_knd_nm||'—'}</td>
    <td style="font-weight:600;color:#16a34a">${formatAmt(r.ctrt_tot_tott_amt)}</td>
    <td style="font-weight:${isCesco(r.clt_nm)?'700':'400'};color:${isCesco(r.clt_nm)?'#2563eb':'#1a1a1a'}">${r.clt_nm||'—'}</td>
    <td style="font-size:11px">${formatDate(r.smz_ctrt_ymd)}</td>
    <td>${serviceBadge(getService(r))}${isOverridden(r)?'<span class="edited-badge">수정됨</span>':''}</td>
  </tr>`).join('');
}

function switchView(v){
  currentView=v;
  document.getElementById('juris-view').style.display=v==='juris'?'block':'none';
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  document.getElementById('tab-juris').className='view-tab'+(v==='juris'?' active':'');
  document.getElementById('tab-list').className='view-tab'+(v==='list'?' active':'');
}

function findRecordById(id){return rawData.find(r=>r._id===id);}

function openEditModal(id){
  const r=findRecordById(id);
  if(!r)return;
  currentEditId=id;
  document.getElementById('sheet-body').innerHTML=`
    <div class="sheet-row"><span class="k">계약명</span><span class="v">${r.ctrt_trgt_nm||'—'}</span></div>
    <div class="sheet-row"><span class="k">자치단체</span><span class="v">${r.wa_laf_hg_nm||''} ${r.laf_hg_nm||''}</span></div>
    <div class="sheet-row"><span class="k">업체명</span><span class="v">${r.clt_nm||'—'}</span></div>
    <div class="sheet-row"><span class="k">계약금액</span><span class="v">${formatAmt(r.ctrt_tot_tott_amt)}</span></div>
    <div class="sheet-row"><span class="k">계약일</span><span class="v">${formatDate(r.smz_ctrt_ymd)}</span></div>
  `;
  document.getElementById('sheet-service-select').value=getService(r);
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('edit-sheet').classList.add('open');
}
function closeEditModal(){
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('edit-sheet').classList.remove('open');
  currentEditId=null;
}
function saveEditFromSheet(){
  if(!currentEditId)return;
  const service=document.getElementById('sheet-service-select').value;
  const r=findRecordById(currentEditId);
  const defaultService=classifyService(r.ctrt_trgt_nm);
  if(service===defaultService){
    delete overrides[currentEditId]; // 자동분류와 같으면 오버라이드 저장 불필요
  }else{
    overrides[currentEditId]={service};
  }
  saveOverrides();
  closeEditModal();
  applyFilter();
  showToast('수정 완료 (이 브라우저에만 저장됨)');
}
function deleteRecordFromSheet(){
  if(!currentEditId)return;
  if(!confirm('이 계약을 목록에서 삭제할까요? (이 브라우저에서만 숨겨지며, 원본 데이터는 지워지지 않습니다)'))return;
  deletedIds.add(currentEditId);
  saveDeleted();
  closeEditModal();
  applyFilter();
  showToast('삭제 완료 (이 브라우저에만 반영됨)');
}

function exportExcel(){
  if(!currentFiltered.length){showToast('데이터가 없습니다');return;}
  const rows=[['시도','자치단체','계약명','계약종류','계약방법','계약금액(원)','업체명','계약일','서비스']];
  [...currentFiltered].sort((a,b)=>jurisKey(a).localeCompare(jurisKey(b),'ko')).forEach(r=>{
    rows.push([r.wa_laf_hg_nm||'',r.laf_hg_nm||'',r.ctrt_trgt_nm||'',
      r.ctrt_knd_nm||'',r.ctrt_mth_nm||'',parseInt(r.ctrt_tot_tott_amt||0),
      r.clt_nm||'',formatDate(r.smz_ctrt_ymd),getService(r)]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:10},{wch:14},{wch:30},{wch:8},{wch:12},{wch:14},{wch:16},{wch:12},{wch:8}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'계약현황');
  const d=new Date().toISOString().split('T')[0].replace(/-/g,'');
  XLSX.writeFile(wb,`세스코_계약현황_${d}.xlsx`);
  showToast('엑셀 다운로드 완료!');
}

function resetFilter(){
  document.querySelectorAll('.kw-chip').forEach(c=>c.classList.add('active'));
  selectAllJurisdictions();
  document.getElementById('ctrt-kind').value='';
  document.getElementById('company-filter').value='';
  document.getElementById('date-from').value='';
  document.getElementById('date-to').value='';
  document.getElementById('global-search').value='';
  cescoMode='all';
  applyFilter();
}

document.getElementById('kw-chips').addEventListener('click',e=>{
  if(e.target.classList.contains('kw-chip')){e.target.classList.toggle('active');applyFilter();}
});

loadData();
</script>
